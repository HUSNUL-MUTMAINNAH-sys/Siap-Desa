<!doctype html>
<!--
  Trik ini memungkinkan React Router (BrowserRouter) bekerja normal di
  GitHub Pages, yang secara default hanya menyajikan file statis.
  Referensi: https://github.com/rafgraph/spa-github-pages
-->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>SIAP DESA</title>
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // sesuai nama repo, ex: /siap-desa
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
